<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Royal Chapter Attendance</title>
<style>
  :root{
    --navy:#0B1E3D;
    --navy-2:#12294F;
    --royal:#1E5AA8;
    --royal-light:#4C8EDA;
    --sky:#E9F1FC;
    --ice:#F4F8FD;
    --white:#FFFFFF;
    --ink:#0B1E3D;
    --muted:#5C7092;
    --line:#DCE6F5;
    --success:#1F9D6F;
    --danger:#D6455A;
    --radius:16px;
    --shadow: 0 10px 30px rgba(11,30,61,0.10);
    --shadow-lg: 0 20px 50px rgba(11,30,61,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--ice);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:Georgia,'Iowan Old Style','Times New Roman',serif; }

  /* ---------- Crest ---------- */
  .crest{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:46px;height:46px;
    border-radius:50%;
    overflow:hidden;
    background:var(--white);
    box-shadow:0 6px 16px rgba(30,90,168,0.3);
    flex-shrink:0;
  }
  .crest img{width:100%;height:100%;object-fit:contain;display:block;}

  /* ---------- Login ---------- */
  .login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(circle at 15% 15%, rgba(76,142,218,0.35), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(30,90,168,0.35), transparent 45%),
      linear-gradient(160deg, var(--navy), var(--navy-2) 55%, #081833);
    position:relative;
    overflow:hidden;
  }
  .login-screen::before{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 22px 22px;
    opacity:0.5;
  }
  .login-card{
    position:relative;
    background:var(--white);
    width:100%;
    max-width:420px;
    border-radius:24px;
    padding:36px 30px 30px;
    box-shadow:var(--shadow-lg);
    text-align:center;
    animation:rise .6s ease;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }
  .login-card .crest{width:64px;height:64px; margin:0 auto 14px;}
  .login-card h1{ font-size:1.5rem; margin:0 0 2px; color:var(--navy); letter-spacing:.2px;}
  .login-card p.sub{ color:var(--muted); font-size:.88rem; margin:0 0 26px;}
  .field{ text-align:left; margin-bottom:16px; }
  .field label{ display:block; font-size:.76rem; font-weight:600; color:var(--navy); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px;}
  select, input[type=text], input[type=tel], input[type=email], input[type=date], textarea{
    width:100%;
    padding:13px 14px;
    border:1.5px solid var(--line);
    border-radius:12px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:.95rem;
    color:var(--ink);
    background:var(--white);
    transition:border-color .15s, box-shadow .15s;
    appearance:none;
    -webkit-appearance:none;
  }
  select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%235C7092' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    padding-right:36px;
  }
  textarea{ resize:vertical; min-height:80px; }
  select:focus, input:focus, textarea:focus{
    outline:none;
    border-color:var(--royal-light);
    box-shadow:0 0 0 4px rgba(76,142,218,0.18);
  }
  .btn{
    width:100%;
    border:none;
    border-radius:12px;
    padding:14px 18px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-weight:700;
    font-size:.95rem;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary{ background:linear-gradient(135deg,var(--royal-light),var(--royal)); color:#fff; box-shadow:0 10px 22px rgba(30,90,168,0.35); }
  .btn-primary:active{ transform:scale(.98); }
  .btn-outline{ background:var(--white); color:var(--royal); border:1.5px solid var(--royal-light); }
  .btn-ghost{ background:transparent; color:var(--muted); font-weight:600; }
  .helper-note{ margin-top:18px; font-size:.74rem; color:var(--muted); line-height:1.5; }

  /* ---------- App shell ---------- */
  .app{ display:none; min-height:100vh; flex-direction:column; }
  .app.active{ display:flex; }
  .topbar{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(120deg,var(--navy),var(--navy-2));
    color:#fff;
    padding:14px 18px;
    display:flex; align-items:center; gap:12px;
    box-shadow:0 6px 18px rgba(11,30,61,0.18);
  }
  .topbar .crest{width:38px;height:38px;}
  .topbar-titles{ flex:1; min-width:0; }
  .topbar-titles .name{ font-family:Georgia,'Iowan Old Style','Times New Roman',serif; font-size:1.02rem; line-height:1.15; }
  .topbar-titles .branch{ font-size:.72rem; color:#B9CBEB; letter-spacing:.03em; }
  .icon-btn{
    background:rgba(255,255,255,0.12);
    border:none; color:#fff;
    width:38px;height:38px;border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .icon-btn svg{width:18px;height:18px;}

  main{ flex:1; padding:20px 18px 100px; max-width:640px; margin:0 auto; width:100%; }

  .section-title{ font-size:1.25rem; margin:6px 0 4px; color:var(--navy); }
  .section-sub{ color:var(--muted); font-size:.88rem; margin:0 0 20px; }

  .card{
    background:var(--white);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px;
    margin-bottom:16px;
  }

  /* Home action tiles */
  .tiles{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:22px; }
  .tile{
    background:var(--white);
    border-radius:18px;
    padding:22px 16px;
    text-align:left;
    box-shadow:var(--shadow);
    cursor:pointer;
    border:1.5px solid transparent;
    transition:transform .12s ease, border-color .12s ease;
    display:flex; flex-direction:column; gap:10px;
  }
  .tile:active{ transform:scale(.97); }
  .tile .tile-icon{
    width:42px;height:42px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:var(--sky); color:var(--royal);
  }
  .tile .tile-icon svg{width:22px;height:22px;}
  .tile h3{ font-size:.98rem; margin:0; color:var(--navy); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-weight:700;}
  .tile p{ margin:0; font-size:.78rem; color:var(--muted); line-height:1.4; }

  .stats-strip{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:22px; }
  .stat{
    background:var(--white); border-radius:14px; padding:14px 10px; text-align:center; box-shadow:var(--shadow);
  }
  .stat .num{ font-family:Georgia,'Iowan Old Style','Times New Roman',serif; font-size:1.5rem; color:var(--royal); }
  .stat .lbl{ font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}

  /* Forms */
  .form-grid{ display:grid; gap:16px; }
  .row-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:420px){ .row-2{ grid-template-columns:1fr; } }

  .toggle-group{ display:flex; gap:10px; }
  .toggle-opt{
    flex:1; text-align:center; padding:12px 8px; border-radius:12px;
    border:1.5px solid var(--line); font-weight:600; font-size:.88rem;
    color:var(--muted); cursor:pointer; user-select:none; transition:all .12s ease;
  }
  .toggle-opt.selected{ background:var(--royal); border-color:var(--royal); color:#fff; }
  .toggle-opt.selected.no{ background:var(--danger); border-color:var(--danger); }

  .radio-group{ display:flex; gap:10px; flex-wrap:wrap; }
  .radio-opt{
    padding:10px 16px; border-radius:999px; border:1.5px solid var(--line);
    font-size:.85rem; font-weight:600; color:var(--muted); cursor:pointer; transition:all .12s ease;
  }
  .radio-opt.selected{ background:var(--sky); border-color:var(--royal-light); color:var(--royal); }

  .submit-bar{
    position:sticky; bottom:76px; background:linear-gradient(180deg, rgba(244,248,253,0), var(--ice) 30%);
    padding:16px 0 4px; z-index:10;
  }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--navy); color:#fff; padding:13px 20px; border-radius:12px;
    font-size:.88rem; font-weight:600; box-shadow:var(--shadow-lg);
    opacity:0; pointer-events:none; transition:all .25s ease; z-index:50;
    display:flex; align-items:center; gap:8px; max-width:90%; text-align:left;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.success{ background:var(--success); }
  .toast.error{ background:var(--danger); }

  /* History */
  .history-item{
    background:var(--white); border-radius:14px; padding:14px 16px; margin-bottom:10px;
    box-shadow:var(--shadow); display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .history-item .who{ font-weight:700; color:var(--navy); font-size:.92rem; }
  .history-item .meta{ color:var(--muted); font-size:.76rem; margin-top:2px; }
  .pill{ font-size:.68rem; font-weight:700; padding:4px 10px; border-radius:999px; background:var(--sky); color:var(--royal); white-space:nowrap; }
  .empty-state{ text-align:center; padding:40px 20px; color:var(--muted); }
  .empty-state svg{ width:44px; height:44px; margin-bottom:10px; opacity:.5; }

  /* Bottom nav */
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:var(--white); border-top:1px solid var(--line);
    display:flex; justify-content:space-around; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 18px rgba(11,30,61,0.06);
  }
  .nav-btn{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--muted); font-size:.66rem; font-weight:600; cursor:pointer; padding:6px 10px; border-radius:10px;
  }
  .nav-btn svg{ width:20px; height:20px; }
  .nav-btn.active{ color:var(--royal); }

  .back-link{ display:inline-flex; align-items:center; gap:6px; color:var(--royal); font-weight:600; font-size:.85rem; cursor:pointer; margin-bottom:10px; }
  .back-link svg{ width:16px; height:16px; }

  .banner-warn{
    background:#FFF4E6; border:1px solid #F3C98B; color:#8A5A11;
    border-radius:12px; padding:12px 14px; font-size:.8rem; line-height:1.5; margin-bottom:18px;
  }
</style>
</head>

  loginMode = loginMode === 'branch' ? 'admin' : 'branch';
  const branchField = document.getElementById('loginBranch').closest('.field');
  const pinField = document.getElementById('adminPinField');
  const toggleLink = document.getElementById('adminToggleLink');
  const actionBtn = document.getElementById('loginActionBtn');
  if(loginMode === 'admin'){
    branchField.style.display = 'none';
    pinField.style.display = 'block';
    toggleLink.textContent = '← Back to Royal Chapter login';
    actionBtn.firstChild.textContent = 'Admin Sign In ';
  } else {
    branchField.style.display = 'block';
    pinField.style.display = 'none';
    toggleLink.textContent = 'Headquarters / Admin login →';
    actionBtn.firstChild.textContent = 'Sign In ';
  }
}

function handleLogin(){
  const name = document.getElementById('loginName').value.trim();
  const position = document.getElementById('loginPosition').value;
  if(loginMode === 'admin'){
    const pin = document.getElementById('adminPin').value.trim();
    if(!name || !pin){ showToast('Please enter your name and the admin PIN.', 'error'); return; }
    if(pin !== CONFIG.adminPin){ showToast('Incorrect admin PIN.', 'error'); return; }
    state.name = name; state.branch = 'Headquarters'; state.position = position; state.isAdmin = true;
    enterApp(name, 'Headquarters (Admin)');
    document.querySelectorAll('[data-admin-only]').forEach(el=> el.style.display = 'flex');
    setView('admin');
    return;
  }
  const branch = document.getElementById('loginBranch').value;
  if(!name || !branch){ showToast('Please enter your name and select a Royal Chapter.', 'error'); return; }
  state.name = name; state.branch = branch; state.position = position; state.isAdmin = false;
  enterApp(name, branch);
  setView('home');
}
function enterApp(name, branchLabel){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('topbarName').textContent = 'Hi, ' + name;
  document.getElementById('topbarBranch').textContent = branchLabel;
}

  state.position = '';

/* ---------------- storage helpers ---------------- */
async function saveRecord(prefix, record){
  const id = prefix + ':' + Date.now() + '-' + Math.random().toString(36).slice(2,7);
  try{
    await window.storage.set(id, JSON.stringify(record), true); // shared so all branches + HQ see one live list
    return true;
  }catch(e){
    console.error('storage error', e);
    return false;
  }
}
async function listRecords(prefix){
  try{
    const res = await window.storage.list(prefix, true);
    if(!res || !res.keys || res.keys.length === 0) return [];
    const items = [];
    for(const key of res.keys){
      try{
        const r = await window.storage.get(key, true);
        if(r && r.value) items.push(JSON.parse(r.value));
      }catch(e){ /* skip unreadable key */ }
    }
    items.sort((a,b)=> (b.savedAt||0) - (a.savedAt||0));
    return items;
  }catch(e){
    console.error('list error', e);
    return [];
  }
}

/**
 * The Google Sheet (via Apps Script) is the real source of truth — this is
 * what the dashboard, home stats, and history all read from. Local shared
 * storage (listRecords above) is only a fallback for when the Apps Script
 * URL isn't configured yet, e.g. while testing inside Claude's preview.
 */
let liveDataCache = null;      // { firstTimers, attendance, source, fetchedAt }
let liveDataInFlight = null;   // in-progress fetch promise, so rapid nav doesn't fire duplicate requests
const LIVE_DATA_TTL_MS = 30000; // reuse data for 30s before hitting the network again

/**
 * Loads a URL via a <script> tag and resolves with whatever JSON payload
 * that script passes to a generated callback function. Unlike fetch()/XHR,
 * <script> tags aren't subject to the browser's CORS same-origin read
 * restrictions, so this is what lets the app actually read data back from
 * Apps Script (which doesn't reliably send CORS headers) instead of only
 * being able to write to it. The Apps Script side (doGet) must support a
 * ?callback= parameter and respond with `callbackName(payload);` — see
 * jsonpResponse() in Code.gs.
 */
function fetchViaJsonp(url, timeoutMs = 15000){
  return new Promise((resolve, reject)=>{
    const callbackName = '__rc_jsonp_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    let settled = false;

    const cleanup = ()=>{
      clearTimeout(timer);
      delete window[callbackName];
      if(script.parentNode) script.parentNode.removeChild(script);
    };

    window[callbackName] = (data)=>{
      if(settled) return;
      settled = true;
      cleanup();
      resolve(data);
    };

    const script = document.createElement('script');
    script.onerror = ()=>{
      if(settled) return;
      settled = true;
      cleanup();
      reject(new Error('JSONP request failed to load'));
    };
    const separator = url.includes('?') ? '&' : '?';
    script.src = url + separator + 'callback=' + encodeURIComponent(callbackName);

    const timer = setTimeout(()=>{
      if(settled) return;
      settled = true;
      cleanup();
      reject(new Error('JSONP request timed out'));
    }, timeoutMs);

    document.head.appendChild(script);
  });
}

async function fetchLiveData(opts = {}){
  const forceRefresh = !!opts.forceRefresh;
  const fresh = liveDataCache && (Date.now() - liveDataCache.fetchedAt) < LIVE_DATA_TTL_MS;

  if(!forceRefresh && fresh) return liveDataCache;
  if(!forceRefresh && liveDataInFlight) return liveDataInFlight; // piggyback on the request already in progress

  liveDataInFlight = (async () => {
    let result;
    if(isAppsScriptConfigured()){
      try{
        const json = await fetchViaJsonp(CONFIG.appsScriptUrl + '?action=getData');
        if(json && json.status === 'success'){
          result = { firstTimers: json.firstTimers || [], attendance: json.attendance || [], comments: json.comments || [], source: 'sheet' };
        } else {
          console.error('Apps Script returned an error:', json && json.message);
        }
      }catch(e){
        console.error('fetchLiveData error — falling back to local storage', e);
      }
    }
    if(!result){
      const [firstTimers, attendance, comments] = await Promise.all([listRecords('firsttimer'), listRecords('attendance'), listRecords('comment')]);
      result = { firstTimers, attendance, comments, source: 'local' };
    }
    result.fetchedAt = Date.now();
    liveDataCache = result;
    liveDataInFlight = null;
    return result;
  })();

  return liveDataInFlight;
}

// Call after any new submission so the next screen shows it immediately instead of stale cached data.
function invalidateLiveDataCache(){
  liveDataCache = null;
}

/* ---------------- apps script submit ---------------- */
function isAppsScriptConfigured(){
  return CONFIG.appsScriptUrl && !CONFIG.appsScriptUrl.startsWith('PASTE_');
}
function submitToAppsScript(formType, dataObj){
  if(!isAppsScriptConfigured()) return false;
  // text/plain avoids a CORS preflight request, which Apps Script web apps don't handle.
  // We can't read the response back (mode:'no-cors' makes it opaque), so this is fire-and-forget —
  // the local shared-storage save alongside it is what the app actually reads back from.
  fetch(CONFIG.appsScriptUrl, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ formType, ...dataObj })
  }).catch(()=>{});
  return true;
}

let lastAttendanceLookupName = null;

function applyAttendanceMatch(match){
  document.getElementById('at_phone').value = match.phone || '';
  if(match.branch) document.getElementById('at_branch').value = match.branch;
  document.getElementById('at_ten').value = match.ten || '';
}

async function lookupAttendanceName(){
  const nameQuery = val('at_fullName').toLowerCase();
  const statusEl = document.getElementById('nameLookupStatus');
  const matchesEl = document.getElementById('nameLookupMatches');
  if(!statusEl || !matchesEl) return;
  if(!nameQuery || nameQuery.length < 3){
    statusEl.textContent = '';
    matchesEl.innerHTML = '';
    return;
  }
  if(nameQuery === lastAttendanceLookupName) return; // avoid redundant re-lookups
  lastAttendanceLookupName = nameQuery;

  statusEl.style.color = 'var(--muted)';
  statusEl.textContent = 'Checking…';
  matchesEl.innerHTML = '';

  const { firstTimers } = await fetchLiveData();
  const matches = firstTimers
    .filter(f=> (f.fullName||'').trim().toLowerCase() === nameQuery)
    .sort((a,b)=> (b.savedAt||0) - (a.savedAt||0));

  // The name field may have changed since this lookup started — bail if so.
  if(val('at_fullName').toLowerCase() !== nameQuery) return;

  if(matches.length === 0){
    statusEl.style.color = 'var(--muted)';
    statusEl.textContent = 'No existing First Timer record found for this name — fill in their details below.';
    return;
  }

  // Auto-fill from the most recent match either way...
  applyAttendanceMatch(matches[0]);

  if(matches.length === 1){
    statusEl.style.color = 'var(--success)';
    statusEl.textContent = `✓ Found "${matches[0].fullName}" — details auto-filled. Just set the meeting type and date.`;
    matchesEl.innerHTML = '';
  } else {
    // Multiple people share this name — flag it and let the leader pick the right one.
    statusEl.style.color = '#8A5A11';
    statusEl.textContent = `⚠ ${matches.length} people named "${matches[0].fullName}" found — auto-filled from the most recent. Tap the correct one below if this isn't right:`;
    matchesEl.innerHTML = matches.map((m, i)=> `
      <div class="radio-opt" data-idx="${i}" style="display:inline-block; margin:4px 6px 0 0;">
        ${escapeHtml(m.phone||'no phone')} · ${escapeHtml(m.branch||'')}
      </div>
    `).join('');
    matchesEl.querySelectorAll('.radio-opt').forEach(el=>{
      el.addEventListener('click', ()=>{
        matchesEl.querySelectorAll('.radio-opt').forEach(o=> o.classList.remove('selected'));
        el.classList.add('selected');
        applyAttendanceMatch(matches[Number(el.dataset.idx)]);
      });
    });
  }
}

let historyListData = [];
function filterHistoryList(){
  const q = val('historySearch').toLowerCase();
  const qPhone = normalizePhone(q);
  if(!q){ renderHistoryList(historyListData); return; }
  renderHistoryList(historyListData.filter(r=>
    (r.fullName||'').toLowerCase().includes(q) || (qPhone && normalizePhone(r.phone||'').includes(qPhone))
  ));
}

function renderHistoryList(combined){

/* ================= ADMIN DASHBOARD ================= */
let adminData = { firstTimers: [], attendance: [], comments: [], people: [] };

function normalizePhone(p){ return (p||'').replace(/\D/g,''); }

function buildPeople(firstTimers, attendance){
  // One row per first-timer registration, enriched with their attendance history
  return firstTimers.map(ft=>{
    const phoneKey = normalizePhone(ft.phone);
    const theirAttendance = phoneKey ? attendance.filter(a=> normalizePhone(a.phone) === phoneKey && a.attended === 'Yes') : [];
    let status = 'First Timer';
    if(theirAttendance.length >= 3) status = 'Member';
    else if(theirAttendance.length >= 1) status = 'Returning';
    return { ...ft, attendanceCount: theirAttendance.length, status };
  });
}

function computeAdminStats(firstTimers, attendance, people){
  const now = Date.now();
  const weekAgo = now - 7*24*60*60*1000;
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
  const firstTimersThisWeek = firstTimers.filter(r=> (r.savedAt||0) >= weekAgo).length;
  const firstTimersThisMonth = firstTimers.filter(r=> (r.savedAt||0) >= monthStart.getTime()).length;
  const attendedYes = attendance.filter(a=> a.attended === 'Yes').length;
  const attendanceRate = attendance.length ? Math.round((attendedYes/attendance.length)*100) : 0;
  const returning = people.filter(p=> p.status === 'Returning' || p.status === 'Member').length;
  return {
    totalFirstTimers: firstTimers.length,
    totalChapters: CONFIG.branches.length,
    firstTimersThisWeek,
    firstTimersThisMonth,
    totalAttendance: attendance.length,
    returning,
    attendanceRate
  };
}

function parseLocalDate(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  return isNaN(d.getTime()) ? null : d;
}

// Counts unique first timers who came BACK for a later meeting within the given window —
// i.e. an attendance record (attended = Yes) dated in that window, for someone already
// registered as a first timer.
function computeReturningPeriodStats(firstTimers, attendance){
  const weekAgoTs = Date.now() - 7*24*60*60*1000;
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
  const firstTimerPhones = new Set(firstTimers.map(ft=> normalizePhone(ft.phone)).filter(Boolean));
  const weekSet = new Set();
  const monthSet = new Set();
  attendance.forEach(a=>{
    if(a.attended !== 'Yes') return;
    const phoneKey = normalizePhone(a.phone);
    if(!phoneKey || !firstTimerPhones.has(phoneKey)) return;
    const d = parseLocalDate(a.meetingDate);
    if(!d) return;
    if(d.getTime() >= weekAgoTs) weekSet.add(phoneKey);
    if(d.getTime() >= monthStart.getTime()) monthSet.add(phoneKey);
  });
  return { returningThisWeek: weekSet.size, returningThisMonth: monthSet.size };
}

// Cumulative "signed up within the last..." windows, based on registration timestamp.
function computeRegistrationSummary(firstTimers){
  const now = Date.now();
  const DAY = 24*60*60*1000;
  const windows = [
    { label: 'Last 7 Days',    ms: 7*DAY },
    { label: 'Last 30 Days',   ms: 30*DAY },
    { label: 'Last 2 Months',  ms: 60*DAY },
    { label: 'Last 6 Months',  ms: 182*DAY },
    { label: 'Last 12 Months', ms: 365*DAY }
  ];
  const data = windows.map(w=> ({
    label: w.label,
    value: firstTimers.filter(ft=> (now - (ft.savedAt||0)) <= w.ms).length
  }));
  data.push({ label: 'All Time', value: firstTimers.length });
  return data;
}

function monthKey(ts){
  if(!ts) return null;
  const d = new Date(ts);
  return d.toLocaleString('en-US', { month:'short', year:'numeric' });
}

function renderBarList(data, opts){
  // data: [{label, value}], opts: {max?, suffix?, emptyMsg?}
  if(!data.length) return `<p style="color:var(--muted); font-size:.82rem; padding:8px 0;">${opts.emptyMsg || 'No data yet.'}</p>`;
  const max = opts.max || Math.max(...data.map(d=>d.value), 1);
  return data.map(d=>`
    <div style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; font-size:.8rem; margin-bottom:4px;">
        <span style="color:var(--navy); font-weight:600;">${escapeHtml(d.label)}</span>
        <span style="color:var(--muted);">${d.value}${opts.suffix||''}</span>
      </div>
      <div style="background:var(--sky); border-radius:8px; height:10px; overflow:hidden;">
        <div style="background:linear-gradient(90deg,var(--royal-light),var(--royal)); height:100%; width:${Math.max(4, (d.value/max)*100)}%; border-radius:8px;"></div>
      </div>
    </div>
  `).join('');
}

// Counts DISTINCT first timers with at least one note logged at each pathway week —
// a funnel showing how many people are being carried through each stage.
function computeJourneyTrackerStats(comments){
  return WEEK_CONFIG.map(wk=>{
    const phones = new Set(
      (comments||[])
        .filter(c=> Number(c.week||1) === wk.week && normalizePhone(c.phone))
        .map(c=> normalizePhone(c.phone))
    );
    return { label: `Week ${wk.week}: ${wk.title}`, value: phones.size };
  });
}

function computeResponsivenessBreakdown(comments){
  const counts = {};
  (comments||[]).forEach(c=>{
    const r = c.responsiveness;
    if(!r) return;
    counts[r] = (counts[r]||0) + 1;
  });
  return Object.entries(counts).map(([label,value])=>({label,value})).sort((a,b)=> b.value - a.value);
}

  if(!draftResponsiveness || parts.length === 0){
    showToast('Please pick a responsiveness level and fill in at least one message.', 'error');
    return;
  }
  const comment = parts.join('\n');
  const data = { phone, fullName, week: wk.week, responsiveness: draftResponsiveness, comment, loggedBy: formatLoggedBy() };
  const sentToScript = submitToAppsScript('comment', data);
  await saveRecord('comment', { ...data, savedAt: Date.now() });
  invalidateLiveDataCache();
  showToast(sentToScript ? 'Note saved ✓' : 'Saved locally — connect your Apps Script URL to sync to Sheets', 'success');

  // Refresh from the source of truth and re-render just this card, staying on the same week
  const fresh = await fetchLiveData({ forceRefresh: true });
  if(profileCache) profileCache.comments = fresh.comments;
  renderGrowthPathwayCard();
}

/* ================= ROYAL CHAPTERS OVERVIEW ================= */
async function renderChaptersView(main){
  main.innerHTML = `
    <span class="back-link" onclick="setView('admin')">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Dashboard
    </span>
    <h2 class="section-title">Royal Chapters</h2>
    <p class="section-sub">First timers and attendance by chapter, all ${CONFIG.branches.length} chapters</p>
    <div class="field" style="margin-bottom:16px;">
      <input type="text" id="chapterSearch" placeholder="Search Royal Chapters…" oninput="filterChaptersView()">
    </div>
    <div id="chaptersList"><p style="color:var(--muted); font-size:.85rem;">Loading…</p></div>
  `;
  const { firstTimers, attendance } = await fetchLiveData();
  const ftByChapter = {};
  const attByChapter = {};
  firstTimers.forEach(f=>{ ftByChapter[f.branch] = (ftByChapter[f.branch]||0) + 1; });
  attendance.forEach(a=>{ attByChapter[a.branch] = (attByChapter[a.branch]||0) + 1; });

  chaptersViewData = CONFIG.branches.map(branch=> ({
    branch,
    firstTimers: ftByChapter[branch] || 0,
    attendance: attByChapter[branch] || 0
  })).sort((a,b)=> b.firstTimers - a.firstTimers);

  renderChaptersList(chaptersViewData);
}

let chaptersViewData = [];
function renderChaptersList(rows){
  const list = document.getElementById('chaptersList');
  if(!list) return;
  if(rows.length === 0){
    list.innerHTML = `<p style="color:var(--muted); font-size:.85rem;">No Royal Chapters match your search.</p>`;
    return;
  }
  list.innerHTML = rows.map(r=>`
    <div class="history-item" data-branch="${escapeHtml(r.branch)}" style="cursor:pointer;">
      <div>
        <div class="who">${escapeHtml(r.branch)}</div>
        <div class="meta">${r.attendance} attendance record${r.attendance===1?'':'s'}</div>
      </div>
      <span class="pill">${r.firstTimers} first timer${r.firstTimers===1?'':'s'}</span>
    </div>
  `).join('');
  list.querySelectorAll('.history-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.selectedChapterBranch = el.dataset.branch;
      setView('chapterDetail');
    });
  });
}
function filterChaptersView(){
  const q = val('chapterSearch').toLowerCase();
  renderChaptersList(chaptersViewData.filter(r=> r.branch.toLowerCase().includes(q)));
}

/* ================= ROYAL CHAPTER DETAIL ================= */
async function renderChapterDetail(main){
  const branch = state.selectedChapterBranch;
  main.innerHTML = `
    <span class="back-link" onclick="setView('chapters')">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Royal Chapters
    </span>
    <h2 class="section-title">${escapeHtml(branch || '')}</h2>
    <p class="section-sub">First timers registered here, and who entered each record</p>
    <div id="chapterDetailStats" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;">
      <p style="color:var(--muted); font-size:.85rem;">Loading…</p>
    </div>
    <div id="chapterDetailList"><p style="color:var(--muted); font-size:.85rem;">Loading…</p></div>
  `;
  if(!branch) return;

  const { firstTimers, attendance } = await fetchLiveData();
  const chapterFirstTimers = firstTimers
    .filter(f=> f.branch === branch)
    .sort((a,b)=> (b.savedAt||0) - (a.savedAt||0));
  const chapterAttendance = attendance.filter(a=> a.branch === branch);

  document.getElementById('chapterDetailStats').innerHTML = `
    <div class="stat"><div class="num">${chapterFirstTimers.length}</div><div class="lbl">First Timers</div></div>
    <div class="stat"><div class="num">${chapterAttendance.length}</div><div class="lbl">Attendance Records</div></div>
  `;

  const listEl = document.getElementById('chapterDetailList');
  if(chapterFirstTimers.length === 0){
    listEl.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <div>No first timers registered here yet.</div>
      </div>`;
    return;
  }
  listEl.innerHTML = chapterFirstTimers.map(f=>`
    <div class="history-item" data-phone="${escapeHtml(f.phone||'')}" style="cursor:pointer;">
      <div>
        <div class="who">${escapeHtml(f.fullName||'Unnamed')}</div>
        <div class="meta">Visited ${escapeHtml(f.visitDate||'')} · Entered by ${escapeHtml(f.loggedBy||'Unknown')}</div>
      </div>
      <span class="pill">${escapeHtml(f.phone||'')}</span>
    </div>
  `).join('');
  listEl.querySelectorAll('.history-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(el.dataset.phone) openProfile(el.dataset.phone);
    });
  });
}

/* ---------------- utils ---------------- */
function val(id){ return document.getElementById(id).value.trim(); }
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
